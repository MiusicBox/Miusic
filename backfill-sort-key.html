<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>เติมกุญแจเรียงเพลง</title>
<style>
  body { font-family: -apple-system, "Sarabun", sans-serif; background:#0f1020; color:#eee; margin:0; padding:24px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:#aab; line-height:1.5; }
  button { font-size:18px; padding:14px 22px; border:0; border-radius:12px; background:#7c5cff; color:#fff; width:100%; margin:12px 0; }
  button:disabled { opacity:.5; }
  pre { background:#1a1b30; padding:14px; border-radius:10px; white-space:pre-wrap; word-break:break-word; min-height:80px; font-size:15px; }
</style>
</head>
<body>
  <h1>เติมกุญแจเรียงเพลง (sort_key)</h1>
  <p>ต้องล็อกอินแอดมินไว้ในเบราว์เซอร์นี้ก่อน แล้วกดปุ่มด้านล่าง ระบบจะทำทีละ 100 เพลงจนครบ</p>
  <button id="go">เริ่มเติมกุญแจ</button>
  <pre id="log">รอกดปุ่ม...</pre>
<script>
const btn = document.getElementById("go");
const log = document.getElementById("log");
const say = (t) => { log.textContent += "\n" + t; };

btn.addEventListener("click", async () => {
  btn.disabled = true;
  log.textContent = "เริ่มทำงาน...";
  let total = 0;
  try {
    for (let i = 0; i < 500; i++) {
      const res = await fetch("/api/admin/backfill-sort-keys", { method: "POST", credentials: "same-origin" });
      const text = await res.text();
      if (!res.ok) {
        say("❌ HTTP " + res.status);
        say(text.slice(0, 300));
        if (res.status === 404) say("→ เว็บยังใช้ worker เวอร์ชันเก่า ต้อง deploy ไฟล์ใหม่ก่อน");
        if (res.status === 401) say("→ ยังไม่ได้ล็อกอินแอดมิน (หรือหมดอายุ) ให้ล็อกอินที่หน้าแอดมินแล้วลองใหม่");
        btn.disabled = false;
        return;
      }
      let body;
      try { body = JSON.parse(text); } catch (_) { say("❌ ตอบกลับไม่ใช่ JSON:\n" + text.slice(0, 200)); btn.disabled = false; return; }
      total += Number(body.updated) || 0;
      say("รอบที่ " + (i + 1) + ": เติมแล้ว " + body.updated + " เพลง (รวม " + total + ")");
      if (!body.remaining) { say("✅ เสร็จแล้ว ไม่มีเพลงเหลือ"); btn.disabled = false; return; }
    }
    say("หยุดที่ 500 รอบ — กดปุ่มอีกครั้งเพื่อทำต่อ");
  } catch (err) {
    say("❌ " + (err && err.message ? err.message : err));
  }
  btn.disabled = false;
});
</script>
</body>
</html>
